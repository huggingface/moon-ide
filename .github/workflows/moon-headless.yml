# Build and publish the two headless images from
# images/headless/Dockerfile to the Hugging Face container registry:
#
#   cr.hf.co/huggingface/moon-bridge — relay + companion PWA
#   cr.hf.co/huggingface/moon-remote — headless IDE on moon-base
#
# Unlike moon-base these track moon-ide commits: every push to main
# that touches what goes into them publishes `:dev` and `:sha-<long>`.
# Pull requests build both targets and push nothing. The build stage
# runs both binaries (`--version`), which is the smoke test.
#
# amd64 only: every machine these run on is. moon-base stays
# multi-arch for laptops.
#
# moon-remote builds `FROM cr.hf.co/huggingface/moon-base:dev`, so
# moon-base.yml has to have published once before this can pass.
#
# Credentials: HF_REGISTRY_TOKEN, see moon-base.yml.

name: moon-headless

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'companion/**'
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
      - '.dockerignore'
      - 'images/headless/**'
      - '.github/workflows/moon-headless.yml'
  pull_request:
    paths:
      - '.dockerignore'
      - 'images/headless/**'
      - '.github/workflows/moon-headless.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout moon-ide
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to cr.hf.co
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: cr.hf.co
          username: hf
          password: ${{ secrets.HF_REGISTRY_TOKEN }}

      - name: Docker meta (moon-bridge)
        id: meta-bridge
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: cr.hf.co/huggingface/moon-bridge
          tags: |
            type=sha,format=long
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Docker meta (moon-remote)
        id: meta-remote
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: cr.hf.co/huggingface/moon-remote
          tags: |
            type=sha,format=long
            type=raw,value=dev,enable={{is_default_branch}}

      # The two targets share the companion and cargo stages; the
      # second build reuses them from the builder's cache.
      - name: Build moon-bridge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/headless/Dockerfile
          target: moon-bridge
          build-args: MOON_BUILD_SHA=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-bridge.outputs.tags }}
          labels: ${{ steps.meta-bridge.outputs.labels }}

      - name: Build moon-remote
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/headless/Dockerfile
          target: moon-remote
          build-args: MOON_BUILD_SHA=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-remote.outputs.tags }}
          labels: ${{ steps.meta-remote.outputs.labels }}
