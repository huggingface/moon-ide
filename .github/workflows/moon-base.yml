# Build, smoke-test, and publish the `moon-base` workspace dev
# image to the Hugging Face container registry at
# `cr.hf.co/huggingface/moon-base` (public: pulling needs no login).
#
# Trigger: only on changes to images/moon-base/** or this
# workflow itself. Per ADR 0007 the image tracks toolchain
# versions, not moon-ide commits — there's no value in rebuilding
# moon-base for every IDE PR.
#
# Topology: per-arch native build on the matching GitHub-hosted
# runner (amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm — both
# free for public repos, no QEMU emulation tax). Each arch
# pushes its image by digest, then a `manifest` job assembles
# the multi-arch tag list with `docker buildx imagetools create`.
#
# The smoke test (`bun install` + `cargo check --workspace
# --locked` against the moon-ide checkout) is the release gate
# from ADR 0005 — a published image, by construction, builds
# moon-ide cleanly.
#
# Registry credentials: one secret, shared with moon-headless.yml.
#   HF_REGISTRY_TOKEN — a Hugging Face access token with write
#   access to the `huggingface/moon-*` container repos. The
#   registry ignores the username. The repos themselves are
#   created on the Hub; a push does not create them.

name: moon-base

on:
  push:
    branches: [main]
    paths:
      - 'images/moon-base/**'
      - '.github/workflows/moon-base.yml'
  pull_request:
    paths:
      - 'images/moon-base/**'
      - '.github/workflows/moon-base.yml'
  workflow_dispatch:

env:
  REGISTRY_IMAGE: cr.hf.co/huggingface/moon-base

jobs:
  build:
    name: Build & smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Sanitise platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout moon-ide
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # 1. Build the image into the local docker daemon so the
      #    smoke step can `docker run` it. Single-platform builds
      #    are required for `load: true`. Cache layers via GHA so
      #    the subsequent push-by-digest build below reuses them
      #    nearly entirely.
      - name: Build (load locally)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/moon-base
          platforms: ${{ matrix.platform }}
          load: true
          tags: moon-base:smoke
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Smoke — toolchain versions
        run: |
          docker run --rm moon-base:smoke bash -c '
            set -e
            rustc --version
            cargo --version
            bun --version
            node --version
            npm --version
            corepack --version
            fnm --version
            uv --version
            hf --version
            gh --version | head -1
            fj version
            rg --version | head -1
            fzf --version
            jq --version
            pkg-config --modversion webkit2gtk-4.1
          '

      # 2. The release gate from ADR 0005: a fresh image must
      #    cleanly build moon-ide. The frontend is built first:
      #    the desktop crate embeds `dist/` at compile time. We bind-mount the checkout
      #    and `chown` it to uid 1000 so the container's `dev`
      #    user can write `target/` and `node_modules/` without
      #    permission gymnastics.
      - name: Smoke — bun install && cargo check
        run: |
          sudo chown -R 1000:1000 .
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            moon-base:smoke \
            bash -c '
              set -e
              bun install --frozen-lockfile
              bun run build:vite
              cargo check --workspace --locked
            '

      - name: Login to cr.hf.co
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: cr.hf.co
          username: hf
          password: ${{ secrets.HF_REGISTRY_TOKEN }}

      # 3. With the smoke green, push by digest. The cache-from
      #    GHA scope means almost every layer is a cache hit —
      #    this step is mostly the export.
      - name: Build & push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/moon-base
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          outputs: |
            type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Push multi-arch manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to cr.hf.co
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: cr.hf.co
          username: hf
          password: ${{ secrets.HF_REGISTRY_TOKEN }}

      # Tag list:
      # - `:dev`     for every push to main (moves with HEAD)
      # - `:sha-<>`  immutable per-commit pin
      # Versioned tags (`:0.1`, `:latest`) come later via tag-based
      # releases; deferred until 0.1.0 ships.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Create & push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${{ env.REGISTRY_IMAGE }}@sha256:%s " *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
